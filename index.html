<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jellyfin</title>
<style>
  :root { color-scheme: dark; --bg:#090909; --panel:#111; --border:#292929; --text:#f2f2f2; --muted:#888; }
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { min-height:100dvh; overflow:hidden; }
  button, a { font:inherit; }
  button { color:var(--text); background:#151515; border:1px solid #333; border-radius:9px; padding:8px 12px; cursor:pointer; }
  button:hover, a.server:hover { background:#1b1b1b; border-color:#666; }
  button:focus-visible, a:focus-visible { outline:2px solid #aaa; outline-offset:3px; }
  #launcher { min-height:100dvh; width:100%; display:grid; place-items:center; padding:24px; }
  .content { width:min(100%,420px); }
  .eyebrow { color:#777; font-size:11px; letter-spacing:.22em; text-transform:uppercase; }
  h1 { margin:12px 0 6px; font-size:clamp(34px,7vw,42px); line-height:1.1; letter-spacing:-.065em; }
  .subtitle { margin:0 0 28px; color:var(--muted); font-size:14px; }
  .servers { display:grid; gap:10px; }
  .server { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:12px; text-decoration:none; transition:background .15s,border-color .15s; }
  .server strong { font-size:14px; font-weight:600; }
  .server small { display:block; margin-top:4px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .arrow { color:#777; font-size:21px; }
  footer { margin-top:28px; color:#555; font-size:10px; letter-spacing:.15em; }
  #viewer { display:none; position:fixed; inset:0; z-index:10; background:#000; }
  #viewer.active { display:block; }
  .topbar { height:52px; position:absolute; z-index:2; inset:0 0 auto 0; display:flex; align-items:center; gap:8px; padding:8px 12px; background:#0b0b0b; border-bottom:1px solid #262626; transition:height .18s,padding .18s; }
  .topbar .site-label { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#999; font-size:12px; padding:0 5px; }
  .topbar button { flex-shrink:0; }
  #frame { position:absolute; inset:52px 0 0; width:100%; height:calc(100% - 52px); border:0; background:#090909; }
  #viewer.minimized .topbar { height:18px; padding:0 8px; background:#111; border-bottom:1px solid #333; }
  #viewer.minimized .topbar > :not(#restore) { display:none !important; }
  #restore { display:none; font-size:10px; line-height:1; padding:1px 8px; border-radius:0 0 7px 7px; }
  #viewer.minimized #restore { display:block; position:absolute; top:0; right:12px; height:18px; }
  #viewer.minimized #frame { inset:18px 0 0; height:calc(100% - 18px); }
  @media (max-width:520px) {
    .topbar { gap:5px; padding:7px; }
    .topbar button { padding:7px 9px; font-size:12px; }
    .topbar .site-label { font-size:11px; }
  }
</style>
</head>
<body>
  <main id="launcher">
    <div class="content">
      <div class="eyebrow">Media access</div>
      <h1>Jellyfin.</h1>
      <p class="subtitle">Choose a server to continue.</p>
      <nav class="servers" aria-label="Jellyfin servers">
        <a class="server" href="http://192.168.1.184:8096" data-name="Local Server">
          <span><strong>Local Server</strong><small>192.168.1.184:8096</small></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="server" href="https://jellyfin.notreallyrx.xyz" data-name="Tailscale Server">
          <span><strong>Tailscale Server</strong><small>jellyfin.notreallyrx.xyz</small></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="server" href="https://jelly.thecwcincfiles.org" data-name="Public Server">
          <span><strong>Public Server</strong><small>jelly.thecwcincfiles.org</small></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <footer>PRIVATE MEDIA · SERVER DIRECTORY</footer>
    </div>
  </main>

  <section id="viewer" aria-label="Embedded Jellyfin server">
    <div class="topbar" id="topbar">
      <button id="back" type="button" title="Back to server list">← Back</button>
      <span class="site-label" id="siteLabel">Jellyfin</span>
      <button id="minimize" type="button" title="Minimize control bar">− Minimize</button>
      <button id="newTab" type="button" title="Open server in a new tab">↗ Open in new tab</button>
      <button id="restore" type="button" title="Restore controls">Bring back controls</button>
    </div>
    <iframe id="frame" title="Jellyfin server" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>
  </section>

<script>
(() => {
  const launcher = document.getElementById('launcher');
  const viewer = document.getElementById('viewer');
  const frame = document.getElementById('frame');
  const siteLabel = document.getElementById('siteLabel');
  let selectedUrl = '';

  document.querySelectorAll('.server').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      selectedUrl = link.href;
      siteLabel.textContent = link.dataset.name || new URL(selectedUrl).hostname;
      viewer.classList.remove('minimized');
      launcher.style.display = 'none';
      viewer.classList.add('active');
      frame.src = selectedUrl;
    });
  });

  document.getElementById('back').addEventListener('click', () => {
    frame.src = 'about:blank';
    viewer.classList.remove('active', 'minimized');
    launcher.style.display = 'grid';
  });

  document.getElementById('minimize').addEventListener('click', () => {
    viewer.classList.add('minimized');
  });

  document.getElementById('restore').addEventListener('click', () => {
    viewer.classList.remove('minimized');
  });

  document.getElementById('newTab').addEventListener('click', () => {
    if (!selectedUrl) return;
    window.open(selectedUrl, '_blank', 'noopener,noreferrer');
  });
})();
</script>
</body>
</html>
