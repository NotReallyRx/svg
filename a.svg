
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 460 600"
     preserveAspectRatio="xMidYMid meet"
     style="background:#090909">
  <rect width="460" height="600" fill="#090909"/>

  <foreignObject x="0" y="0" width="460" height="600">
    <div xmlns="http://www.w3.org/1999/xhtml" class="app">
      <style>
        * { box-sizing: border-box; }
        .app {
          width: 100%;
          height: 600px;
          padding: 35px 24px 60px;
          background: #090909;
          color: #eee;
          font: 14px system-ui, sans-serif;
          position: relative;
        }
        .content { width: 100%; max-width: 360px; margin: 0 auto; }
        .label { color: #777; font-size: 11px; letter-spacing: 3px; }
        h1 { font-size: 36px; letter-spacing: -2px; margin: 12px 0 6px; }
        .sub { color: #888; margin: 0 0 24px; }
        .servers { display: grid; gap: 10px; }
        .server {
          display: flex; align-items: center; justify-content: space-between;
          padding: 17px; background: #111; border: 1px solid #292929;
          border-radius: 12px; color: #eee; text-decoration: none;
          transition: .2s;
        }
        .server:hover { background: #1c1c1c; border-color: #666; }
        strong { font-size: 14px; }
        small { display: block; margin-top: 4px; color: #888; font-size: 11px; overflow-wrap: anywhere; }
        .arrow { color: #777; font-size: 20px; }
        footer { margin-top: 25px; color: #555; font-size: 10px; letter-spacing: 1.5px; }
        .mode {
          position: absolute; bottom: 14px; right: 14px;
          display: flex; align-items: center; gap: 8px;
          color: #888; font-size: 10px;
        }
        .switch {
          position: relative; width: 38px; height: 21px;
          border: 1px solid #444; border-radius: 20px;
          background: #191919; cursor: pointer; padding: 0;
        }
        .knob {
          display: block; width: 13px; height: 13px;
          border-radius: 50%; background: #eee;
          position: absolute; top: 3px; left: 3px;
          transition: transform .2s;
        }
        .switch[aria-checked="true"] .knob { transform: translateX(16px); }
        .viewer { display: none; position: absolute; inset: 0; background: #090909; padding: 12px; }
        .viewer.active { display: flex; flex-direction: column; }
        .bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; gap: 8px; }
        .bar button {
          color: #eee; background: #181818; border: 1px solid #333;
          border-radius: 7px; padding: 7px 12px; cursor: pointer;
        }
        .url { color: #888; font-size: 11px; overflow-wrap: anywhere; }
        iframe { width: 100%; flex: 1; min-height: 0; border: 1px solid #292929; border-radius: 8px; background: #111; }
        .hint { color: #777; font-size: 11px; margin-top: 8px; }
      </style>

      <main class="content" id="home">
        <div class="label">MEDIA ACCESS</div>
        <h1>Jellyfin.</h1>
        <p class="sub">Choose a server to continue.</p>

        <nav class="servers">
          <a class="server" href="http://192.168.1.184:8096">
            <div><strong>Local Server</strong><small>192.168.1.184:8096</small></div>
            <span class="arrow">↗</span>
          </a>
          <a class="server" href="https://jellyfin.notreallyrx.xyz">
            <div><strong>Tailscale Server</strong><small>jellyfin.notreallyrx.xyz</small></div>
            <span class="arrow">↗</span>
          </a>
          <a class="server" href="https://jelly.thecwcincfiles.org">
            <div><strong>Public Server</strong><small>jelly.thecwcincfiles.org</small></div>
            <span class="arrow">↗</span>
          </a>
        </nav>

        <footer>PRIVATE MEDIA · SERVER DIRECTORY</footer>
      </main>

      <section class="viewer" id="viewer">
        <div class="bar">
          <button id="back" type="button">← Back</button>
          <span class="url" id="currentUrl"></span>
          <button id="external" type="button" title="Open in new tab">↗</button>
        </div>
        <iframe id="frame" title="Jellyfin server"
                referrerpolicy="no-referrer"></iframe>
        <div class="hint" id="hint"></div>
      </section>

      <div class="mode">
        <span id="modeText">New tab</span>
        <button class="switch" id="toggle" type="button"
                role="switch" aria-checked="false"
                aria-label="Toggle iframe mode">
          <span class="knob"></span>
        </button>
      </div>

      <script>
        const toggle = document.getElementById('toggle');
        const modeText = document.getElementById('modeText');
        const home = document.getElementById('home');
        const viewer = document.getElementById('viewer');
        const frame = document.getElementById('frame');
        const currentUrl = document.getElementById('currentUrl');
        const hint = document.getElementById('hint');
        let iframeMode = false;
        let selectedUrl = '';

        toggle.addEventListener('click', () => {
          iframeMode = !iframeMode;
          toggle.setAttribute('aria-checked', String(iframeMode));
          modeText.textContent = iframeMode ? 'Iframe' : 'New tab';
        });

        document.querySelectorAll('.server').forEach(link => {
          link.addEventListener('click', event => {
            event.preventDefault();
            selectedUrl = link.href;

            if (!iframeMode) {
              window.open(selectedUrl, '_blank', 'noopener');
              return;
            }

            home.style.display = 'none';
            viewer.classList.add('active');
            currentUrl.textContent = selectedUrl;
            hint.textContent = 'If this server blocks embedding, use ↗ to open it in a new tab.';
            frame.src = selectedUrl;
          });
        });

        document.getElementById('back').addEventListener('click', () => {
          frame.src = 'about:blank';
          viewer.classList.remove('active');
          home.style.display = '';
        });

        document.getElementById('external').addEventListener('click', () => {
          if (selectedUrl) window.open(selectedUrl, '_blank', 'noopener');
        });
      </script>
    </div>
  </foreignObject>
</svg>
