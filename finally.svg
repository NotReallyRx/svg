<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:html="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 100% 100%">

  <rect width="100%" height="100%" fill="#090909"/>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" id="app">

      <style>
        * { box-sizing: border-box; }

        html, body { margin: 0; background: #090909; }

        #app {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #090909;
          color: #f2f2f2;
          font: 14px system-ui, sans-serif;
          overflow: hidden;
        }

        button {
          color: #eee;
          background: #151515;
          border: 1px solid #333;
          border-radius: 9px;
          padding: 8px 12px;
          cursor: pointer;
          font: inherit;
        }

        button:hover, .server:hover {
          background: #1b1b1b;
          border-color: #666;
        }

        #launcher {
          height: 100%;
          display: grid;
          place-items: center;
          padding: 24px;
        }

        .content { width: min(100%, 420px); }

        .eyebrow {
          color: #777;
          font-size: 11px;
          letter-spacing: .22em;
          text-transform: uppercase;
        }

        h1 {
          margin: 12px 0 6px;
          font-size: clamp(34px, 7vw, 42px);
          letter-spacing: -.065em;
        }

        .subtitle {
          margin: 0 0 28px;
          color: #888;
        }

        .servers {
          display: grid;
          gap: 10px;
        }

        .server {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          padding: 18px;
          color: #f2f2f2;
          background: #111;
          border: 1px solid #292929;
          border-radius: 12px;
          text-decoration: none;
          cursor: pointer;
        }

        .server strong { font-size: 14px; }

        .server small {
          display: block;
          margin-top: 4px;
          color: #888;
          font-size: 12px;
        }

        .arrow { color: #777; font-size: 21px; }

        footer {
          margin-top: 28px;
          color: #555;
          font-size: 10px;
          letter-spacing: .15em;
        }

        #viewer {
          display: none;
          position: fixed;
          inset: 0;
          background: #000;
          z-index: 10;
        }

        #viewer.active { display: block; }

        #toolbar {
          position: absolute;
          z-index: 2;
          inset: 0 0 auto;
          height: 52px;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 12px;
          background: #0b0b0b;
          border-bottom: 1px solid #262626;
        }

        #server-name {
          min-width: 0;
          flex: 1;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          color: #999;
          font-size: 12px;
        }

        #server-frame {
          position: absolute;
          inset: 52px 0 0;
          width: 100%;
          height: calc(100% - 52px);
          border: 0;
          background: #090909;
        }

        #viewer.minimized #toolbar {
          height: 18px;
          padding: 0 8px;
          background: #111;
        }

        #viewer.minimized #toolbar > :not(#restore-controls) {
          display: none;
        }

        #restore-controls {
          display: none;
          position: absolute;
          top: 0;
          right: 12px;
          height: 18px;
          padding: 1px 8px;
          border-radius: 0 0 7px 7px;
          font-size: 10px;
        }

        #viewer.minimized #restore-controls { display: block; }

        #viewer.minimized #server-frame {
          inset: 18px 0 0;
          height: calc(100% - 18px);
        }

        @media (max-width: 520px) {
          #toolbar { gap: 5px; padding: 7px; }
          #toolbar button { padding: 7px 9px; font-size: 12px; }
          #server-name { font-size: 11px; }
        }
      </style>

      <main id="launcher">
        <div class="content">
          <div class="eyebrow">Media access</div>
          <h1>Jellyfin.</h1>
          <p class="subtitle">Choose a server to continue.</p>

          <nav class="servers">
            <a class="server"
               href="https://192.168.1.184:8097"
               data-name="Local Server">
              <span>
                <strong>Local Server</strong>
                <small>Local network</small>
              </span>
              <span class="arrow">↗</span>
            </a>

            <a class="server"
               href="https://jellyfin.notreallyrx.xyz"
               data-name="Tailscale Server">
              <span>
                <strong>Tailscale Server</strong>
                <small>Private remote access</small>
              </span>
              <span class="arrow">↗</span>
            </a>

            <a class="server"
               href="https://jelly.thecwcincfiles.org"
               data-name="Public Server">
              <span>
                <strong>Public Server</strong>
                <small>Public access</small>
              </span>
              <span class="arrow">↗</span>
            </a>
          </nav>

          <footer>PRIVATE MEDIA · SERVER DIRECTORY</footer>
        </div>
      </main>

      <section id="viewer">
        <div id="toolbar">
          <button id="back-button" type="button">← Back</button>
          <span id="server-name">Jellyfin</span>
          <button id="minimize-button" type="button">− Minimize</button>
          <button id="open-button" type="button">↗ Open in new tab</button>
          <button id="restore-controls" type="button">Bring back controls</button>
        </div>

        <iframe id="server-frame"
                title="Jellyfin server"
                allow="autoplay; fullscreen; picture-in-picture"
                referrerpolicy="no-referrer"></iframe>
      </section>

      <script>
        (() => {
          const launcher = document.getElementById("launcher");
          const viewer = document.getElementById("viewer");
          const frame = document.getElementById("server-frame");
          const serverName = document.getElementById("server-name");

          let currentServer = "";

          document.querySelectorAll(".server").forEach(server => {
            server.addEventListener("click", event => {
              event.preventDefault();

              currentServer = server.href;
              serverName.textContent = server.dataset.name;

              viewer.classList.remove("minimized");
              launcher.style.display = "none";
              viewer.classList.add("active");
              frame.src = currentServer;
            });
          });

          document.getElementById("back-button").onclick = () => {
            frame.src = "about:blank";
            viewer.classList.remove("active", "minimized");
            launcher.style.display = "grid";
          };

          document.getElementById("minimize-button").onclick = () => {
            viewer.classList.add("minimized");
          };

          document.getElementById("restore-controls").onclick = () => {
            viewer.classList.remove("minimized");
          };

          document.getElementById("open-button").onclick = () => {
            if (currentServer) {
              window.open(
                currentServer,
                "_blank",
                "noopener,noreferrer"
              );
            }
          };
        })();
      </script>

    </div>
  </foreignObject>
</svg>
